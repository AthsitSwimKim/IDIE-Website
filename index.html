      **ครอปให้ตราชนขอบทั้งสี่ด้าน** — ไฟล์ที่ได้มาเหลือพื้นโปร่งรอบวงกลมด้านละ 8%
      พอย่อลงเหลือ 16–32px ในแถบแท็บแล้ววงกลมเล็กจนอ่านตัวอักษรไม่ออก ครอปทิ้งแล้ว
      ตราใหญ่ขึ้น 19% ในกรอบเท่าเดิม โดยไม่ต้องเปลี่ยนอาร์ตเวิร์ก

      **พื้นโปร่งได้เฉพาะ favicon เท่านั้น** — ตราเป็นวงกลม มุมทั้งสี่จึงโปร่ง ซึ่งดีกับ
      แท็บเบราว์เซอร์ เพราะวงกลมจะลอยอยู่บนแถบแท็บได้ทั้งธีมสว่างและธีมมืด

      แต่ apple-touch-icon กับไอคอนใน manifest **ต้องทึบ** จึงถมพื้นขาวให้ก่อน —
      iOS ถมพื้นโปร่งด้วยสีดำ ถ้าปล่อยโปร่งไว้จะได้วงกลมน้ำเงินบนพื้นดำบนหน้าจอโฮม
      ส่วน manifest ประกาศ background_color เป็นขาว การถมขาวจึงทำให้ตรงกัน
      ระบบปฏิบัติการใส่ขอบมนให้เองอยู่แล้ว เราจึงไม่ต้องเว้นขอบมาให้

      ขนาด 48 มีไว้ให้จอความละเอียดสูงที่วาดแท็บที่ 2x จะได้ไม่เบลอ
