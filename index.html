<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ไอคอนทุกขนาดสร้างจาก /images/brand/idie-icon-tile.png
      (ตราวงกลม IDIE ที่บริษัทส่งมา ก.ย. 2026 ครอปขอบโปร่งรอบ ๆ ออกแล้ว)

      **ครอปให้ตราชนขอบทั้งสี่ด้าน** — ไฟล์ที่ได้มาเหลือพื้นโปร่งรอบวงกลมด้านละ 8%
      พอย่อลงเหลือ 16–32px ในแถบแท็บแล้ววงกลมเล็กจนอ่านตัวอักษรไม่ออก ครอปทิ้งแล้ว
      ตราใหญ่ขึ้น 19% ในกรอบเท่าเดิม โดยไม่ต้องเปลี่ยนอาร์ตเวิร์ก

      **พื้นโปร่งได้เฉพาะ favicon เท่านั้น** — ตราเป็นวงกลม มุมทั้งสี่จึงโปร่ง ซึ่งดีกับ
      แท็บเบราว์เซอร์ เพราะวงกลมจะลอยอยู่บนแถบแท็บได้ทั้งธีมสว่างและธีมมืด

      แต่ apple-touch-icon กับไอคอนใน manifest **ต้องทึบ** จึงถมพื้นขาวให้ก่อน —
      iOS ถมพื้นโปร่งด้วยสีดำ ถ้าปล่อยโปร่งไว้จะได้วงกลมน้ำเงินบนพื้นดำบนหน้าจอโฮม
      ส่วน manifest ประกาศ background_color เป็นขาว การถมขาวจึงทำให้ตรงกัน
      ระบบปฏิบัติการใส่ขอบมนให้เองอยู่แล้ว เราจึงไม่ต้องเว้นขอบมาให้

      ขนาด 48 มีไว้ให้จอความละเอียดสูงที่วาดแท็บที่ 2x จะได้ไม่เบลอ
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0435b9" />
    <title>ID Industrial Engineering Co.,Ltd.</title>
    <!--
      ค่าเริ่มต้นสำหรับ crawler ที่ไม่รัน JavaScript (Facebook, LINE, Bing บางส่วน)
      ทุกหน้าเขียนทับแท็กชุดนี้ตอนโหลดผ่าน src/components/layout/Seo.tsx — เพิ่ม/ลบแท็ก
      ตรงนี้ต้องแก้ที่นั่นให้ตรงกัน ไม่งั้นจะได้แท็กซ้ำสองอัน
    -->
    <meta
      name="description"
      content="ID Industrial Engineering Co.,Ltd. — Intercom, public address and alarm, network and CCTV systems for industrial plants and hazardous areas."
    />
    <link rel="canonical" href="https://www.idindustrialengineering.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ID Industrial Engineering Co.,Ltd." />
    <meta property="og:title" content="ID Industrial Engineering Co.,Ltd." />
    <meta
      property="og:description"
      content="ID Industrial Engineering Co.,Ltd. — Intercom, public address and alarm, network and CCTV systems for industrial plants and hazardous areas."
    />
    <meta property="og:url" content="https://www.idindustrialengineering.com/" />
    <meta property="og:image" content="https://www.idindustrialengineering.com/images/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
